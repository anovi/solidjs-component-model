<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>My Custom DevTool Panel</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 12px;
        background: #1e1e1e;
        color: #e0e0e0;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 500;
      }
      button {
        background: #0e639c;
        color: #fff;
        border: none;
        padding: 8px 14px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover {
        background: #1177bb;
      }
      pre {
        background: #252526;
        border: 1px solid #3c3c3c;
        border-radius: 3px;
        padding: 8px;
        margin-top: 12px;
        max-height: 300px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        line-height: 1.5;
      }
      .log-info { color: #9cdcfe; }
      .log-warn { color: #dcdcaa; }
      .log-error { color: #f48771; }
    </style>
  </head>
  <body>
    <h2>My Custom DevTool Panel</h2>
    <button id="trigger">Trigger console.log from inspected page</button>
    <button id="clear">Clear</button>
    <pre id="log"></pre>
    <script src="panel.js"></script>
  </body>
</html>
